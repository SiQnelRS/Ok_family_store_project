name: ok-family-deploy

x-service: &app
  image: ok-family-app:${DEPLOY_TAG:-local}
  pull_policy: never
  init: true
  restart: unless-stopped

x-backend-env: &backend-env
  SERVICE_HOST: 0.0.0.0
  WEB_ORIGIN: ${WEB_ORIGIN:?Configure WEB_ORIGIN con la URL HTTPS de la tienda}

x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL para el despliegue}

x-after-migration: &after-migration
  migrate:
    condition: service_completed_successfully

x-health: &health
  interval: 10s
  timeout: 4s
  retries: 6
  start_period: 10s

services:
  migrate:
    image: ok-family-migrate:${DEPLOY_TAG:-local}
    pull_policy: never
    build:
      context: .
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Configure DATABASE_URL}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  auth:
    <<: *app
    command: ["node", "apps/auth-service/dist/main.js"]
    environment:
      <<: [*backend-env, *db-env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *after-migration
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]

  catalog:
    <<: *app
    command: ["node", "apps/catalog-service/dist/main.js"]
    environment:
      <<: [*backend-env, *db-env]
      CATALOG_UPLOAD_DIR: /var/lib/ok-family/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - catalog_uploads:/var/lib/ok-family/uploads
    depends_on: *after-migration
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]

  commerce:
    <<: *app
    command: ["node", "apps/commerce-service/dist/main.js"]
    environment:
      <<: [*backend-env, *db-env]
      AUTH_SERVICE_URL: http://auth:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      LOCAL_DELIVERY_RATES_JSON: ${LOCAL_DELIVERY_RATES_JSON:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_CHECKOUT_ENABLED: ${STRIPE_CHECKOUT_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *after-migration
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]

  gateway:
    <<: *app
    command: ["node", "apps/api-gateway/dist/main.js"]
    environment:
      <<: *backend-env
      AUTH_SERVICE_URL: http://auth:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      COMMERCE_SERVICE_URL: http://commerce:4003
    depends_on:
      commerce:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]

  frontend:
    <<: *app
    build:
      context: .
      target: runtime
    command: ["node", "node_modules/next/dist/bin/next", "start", "apps/frontend", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      API_GATEWAY_URL: http://gateway:4000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${DEPLOY_BIND_IP:-127.0.0.1}:${DEPLOY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEPLOY_TLS_DIR:-./.data/deploy-tls}:/etc/nginx/tls:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  catalog_uploads:
